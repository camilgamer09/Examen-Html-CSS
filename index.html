<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formacion Vial</title>
    <link rel="stylesheet" href="Css/styless.css">
    <link rel="stylesheet" href="img">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>

    <header class="header">
     <h1 class="logo">Formacion Vial</h1>
    </header>
    <main class="main">
        <nav class="busqueda">
            <div class="material-symbols-outlined">search</div>
            <input type="text" placeholder="Busca la clase que estas buscando ...">
        </nav>
    </main>
    <section class="categorias">
        <h2>Clases de nuestra entidad</h2>
            <section>   
                <div class="columnas">
                        <article class="producto-tarjeta curmoto">
                            <div class="imagen">
                                <img src="img/halcon.png" alt="curmoto">
                            </div>
                            <h3 class="titulo">Curso de conduccion moto</h3>
                            <p class="titulo">Aprende a conducir moto</p>
                            <p class="precio-producto">$999.990</p>
                            </article>
                        <article class="producto-tarjeta curcarro">
                            <div class="imagen">
                                <img src="img/cocodrilo.png" alt="curcarro">
                            </div>
                            <h3 class="titulo">Curso de conduccion carro</h3>
                            <p class="titulo">Aprende a conducir carro</p>
                            <p class="precio-producto">$999.990</p>
                            </article>
                        <article class="producto-tarjeta classteorica">
                            <div class="imagen">
                                <img src="img/edificios.jpg" alt="classteorica">
                            </div>
                            <h3 class="titulo">Clases teoricas de conduccion</h3>
                            <p class="titulo">Aprende la teoria de como conducir en carretera</p>
                            <p class="precio-producto">$999.990</p>
                            </article>
                </div>
            </section>
        </nav>
    </section>
</body>
</html>
